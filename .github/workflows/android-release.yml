name: Android release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach artifacts to an existing GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing release tag, for example V0.1.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ECHODAY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ECHODAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ECHODAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$ECHODAY_STORE_PASSWORD" || -z "$ECHODAY_KEY_ALIAS" || -z "$ECHODAY_KEY_PASSWORD" ]]; then
            echo 'Android signing secrets are incomplete.' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/echoday-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ECHODAY_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release

      - name: Verify and stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          test -n "$version"
          mkdir -p dist/android
          universal="dist/android/EchoDay-v${version}-android-universal.apk"
          arm64="dist/android/EchoDay-v${version}-android-arm64-v8a.apk"
          bundle="dist/android/EchoDay-v${version}-android.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$universal"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$arm64"
          cp build/app/outputs/bundle/release/app-release.aab "$bundle"
          forbidden='(^|/)(key\.properties|[^/]*\.(jks|keystore|sqlite|sqlite3|db)|EchoDay-backup-[^/]*|before-(clear|restore)-[^/]*|[^/]*signing-credentials[^/]*)$'
          for archive in "$universal" "$arm64" "$bundle"; do
            if unzip -Z1 "$archive" | grep -Eiq "$forbidden"; then
              echo "Private or user-data payload found in $archive" >&2
              exit 1
            fi
          done
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$universal"
          "$apksigner" verify --verbose --print-certs "$arm64"
          jarsigner -verify "$bundle"
          (cd dist/android && sha256sum EchoDay-v${version}-android-universal.apk EchoDay-v${version}-android-arm64-v8a.apk EchoDay-v${version}-android.aab > EchoDay-v${version}-android.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: echoday-android-release
          path: dist/android/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tag release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: docs/RELEASE_NOTES_ANDROID_v0.1.0.md
          files: dist/android/*

      - name: Publish manually selected release assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: true
          body_path: docs/RELEASE_NOTES_ANDROID_v0.1.0.md
          files: dist/android/*
