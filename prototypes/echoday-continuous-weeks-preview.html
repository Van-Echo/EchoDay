}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

.form-switch .form-check-input {

  height: 20px;

  background: var(--muted);
  box-shadow: none;

.form-switch .form-check-input::before {

  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

    &lt;div class=&quot;ew-workspace&quot;&gt;

          &lt;div class=&quot;ew-week-zoom&quot;&gt;

      &lt;button class=&quot;ew-divider&quot; id=&quot;ew-divider&quot; type=&quot;button&quot; role=&quot;separator&quot; aria-label=&quot;调整日历与 TODO 栏宽度&quot; aria-orientation=&quot;vertical&quot; aria-valuemin=&quot;12.5&quot; aria-valuemax=&quot;50&quot; aria-valuenow=&quot;12.5&quot;&gt;&lt;/button&gt;

      &lt;aside class=&quot;ew-sidebar&quot; aria-label=&quot;所选日期待办&quot;&gt;

          &lt;/div&gt;
          &lt;button class=&quot;ew-expand&quot; type=&quot;button&quot; aria-label=&quot;全屏打开当日 TODO&quot; data-action=&quot;expand&quot;&gt;&lt;i data-lucide=&quot;maximize-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;

    &lt;button class=&quot;ew-fab&quot; type=&quot;button&quot; aria-label=&quot;回到今天&quot; data-action=&quot;today&quot;&gt;&lt;i data-lucide=&quot;calendar-days&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;

    &lt;section class=&quot;ew-focus&quot; id=&quot;ew-focus&quot; aria-hidden=&quot;true&quot; aria-label=&quot;全屏当日 TODO&quot;&gt;
      &lt;header class=&quot;ew-focus-toolbar&quot;&gt;
        &lt;button class=&quot;ew-back&quot; type=&quot;button&quot; data-action=&quot;collapse&quot;&gt;&lt;i data-lucide=&quot;arrow-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 返回日历&lt;/button&gt;
        &lt;strong class=&quot;ew-focus-title&quot; id=&quot;ew-focus-title&quot;&gt;9 月 3 日，周四&lt;/strong&gt;
        &lt;small&gt;全屏 TODO&lt;/small&gt;
        &lt;span class=&quot;ew-focus-sort&quot;&gt;优先级 → 执行/DDL → 创建时间&lt;/span&gt;
      &lt;/header&gt;
      &lt;div class=&quot;ew-focus-body&quot;&gt;
        &lt;div class=&quot;ew-focus-summary&quot;&gt;
          &lt;h2&gt;当日待办&lt;/h2&gt;
          &lt;span id=&quot;ew-focus-count&quot;&gt;5 项未完成&lt;/span&gt;
        &lt;/div&gt;
        &lt;input class=&quot;ew-focus-add&quot; id=&quot;ew-focus-add&quot; placeholder=&quot;添加待办，按 Enter 创建&quot; aria-label=&quot;全屏模式快速添加待办&quot;&gt;
        &lt;div class=&quot;ew-section-title&quot;&gt;&lt;span&gt;未完成&lt;/span&gt;&lt;span&gt;综合排序&lt;/span&gt;&lt;/div&gt;
        &lt;div id=&quot;ew-focus-active&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;ew-section-title&quot;&gt;&lt;span&gt;已完成&lt;/span&gt;&lt;span id=&quot;ew-focus-done-count&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
        &lt;div id=&quot;ew-focus-done&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;div class=&quot;ew-toast&quot; id=&quot;ew-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;echoday-weeks-prototype&#x27;);
      const shell = root.querySelector(&#x27;#ew-shell&#x27;);
      const workspace = root.querySelector(&#x27;.ew-workspace&#x27;);
      const grid = root.querySelector(&#x27;#ew-grid&#x27;);
      const divider = root.querySelector(&#x27;#ew-divider&#x27;);
      const floatingToday = root.querySelector(&#x27;.ew-fab&#x27;);
      const weekCountLabel = root.querySelector(&#x27;#ew-week-count&#x27;);
      const visibleRange = root.querySelector(&#x27;#ew-visible-range&#x27;);
      const rangeLabel = root.querySelector(&#x27;#ew-range-label&#x27;);
      const sideDate = root.querySelector(&#x27;#ew-side-date&#x27;);
      const sideMeta = root.querySelector(&#x27;#ew-side-meta&#x27;);
      const activeHost = root.querySelector(&#x27;#ew-active-tasks&#x27;);
      const doneHost = root.querySelector(&#x27;#ew-done-tasks&#x27;);
      const doneCount = root.querySelector(&#x27;#ew-done-count&#x27;);
      const focus = root.querySelector(&#x27;#ew-focus&#x27;);
      const focusTitle = root.querySelector(&#x27;#ew-focus-title&#x27;);
      const focusCount = root.querySelector(&#x27;#ew-focus-count&#x27;);
      const focusActive = root.querySelector(&#x27;#ew-focus-active&#x27;);
      const focusDone = root.querySelector(&#x27;#ew-focus-done&#x27;);
      const focusDoneCount = root.querySelector(&#x27;#ew-focus-done-count&#x27;);
      const toast = root.querySelector(&#x27;#ew-toast&#x27;);
      const weekdays = [&#x27;周日&#x27;,&#x27;周一&#x27;,&#x27;周二&#x27;,&#x27;周三&#x27;,&#x27;周四&#x27;,&#x27;周五&#x27;,&#x27;周六&#x27;];
      const chineseMonths = [&#x27;一&#x27;,&#x27;二&#x27;,&#x27;三&#x27;,&#x27;四&#x27;,&#x27;五&#x27;,&#x27;六&#x27;,&#x27;七&#x27;,&#x27;八&#x27;,&#x27;九&#x27;,&#x27;十&#x27;,&#x27;十一&#x27;,&#x27;十二&#x27;];
      const timelineStart = new Date(2026, 6, 27);
      const today = new Date(2026, 8, 3);
      const taskNames = {
        &#x27;2026-08-28&#x27;: [&#x27;八月总结&#x27;, &#x27;备份项目资料&#x27;, &#x27;整理账单&#x27;],
        &#x27;2026-09-01&#x27;: [&#x27;确认九月计划&#x27;, &#x27;购买咖啡豆&#x27;],
        &#x27;2026-09-02&#x27;: [&#x27;完善交互方案&#x27;, &#x27;回复项目邮件&#x27;, &#x27;力量训练&#x27;],
        &#x27;2026-09-03&#x27;: [&#x27;调整连续周布局&#x27;, &#x27;补充 2K/4K 适配&#x27;, &#x27;验证 Ctrl+滚轮&#x27;, &#x27;采购晚餐食材&#x27;, &#x27;阅读 30 分钟&#x27;, &#x27;备份旧笔记&#x27;, &#x27;整理桌面&#x27;],
        &#x27;2026-09-07&#x27;: [&#x27;节气内容校对&#x27;],
        &#x27;2026-09-15&#x27;: [&#x27;移动端适配方案&#x27;, &#x27;Flutter 技术调研&#x27;, &#x27;缴纳账单&#x27;],
        &#x27;2026-09-23&#x27;: [&#x27;季度复盘&#x27;, &#x27;调整十月目标&#x27;],
        &#x27;2026-09-25&#x27;: [&#x27;准备中秋礼物&#x27;, &#x27;家庭聚餐&#x27;],
        &#x27;2026-10-01&#x27;: [&#x27;国庆出行&#x27;, &#x27;检查门窗&#x27;],
        &#x27;2026-10-12&#x27;: [&#x27;十月阶段复盘&#x27;, &#x27;整理照片&#x27;],
        &#x27;2026-10-20&#x27;: [&#x27;项目备份&#x27;, &#x27;预约体检&#x27;],
        &#x27;2026-11-06&#x27;: [&#x27;冬季计划&#x27;, &#x27;年度目标预览&#x27;]
      };
      const calendarLabels = {
        &#x27;2026-09-07&#x27;: &#x27;白露&#x27;,
        &#x27;2026-09-23&#x27;: &#x27;秋分&#x27;,
        &#x27;2026-09-25&#x27;: &#x27;中秋·休&#x27;,
        &#x27;2026-10-01&#x27;: &#x27;国庆·休&#x27;,
        &#x27;2026-10-10&#x27;: &#x27;班&#x27;,
        &#x27;2026-11-07&#x27;: &#x27;立冬&#x27;
      };
      const taskDetails = {};
      let visibleWeeks = 5;
      let startWeek = 5;
      let selected = new Date(today);
      let toastTimer;
      let lastWheelAt = 0;
      let lastObservedGridHeight = 0;
      let lastObservedWorkspaceWidth = 0;
      let sidebarRatio = 0.125;
      let splitPointerId = null;

      function clampSidebarRatio(value) {
        return Math.max(0.125, Math.min(0.5, value));
      }

      function applySidebarRatio(value) {
        sidebarRatio = clampSidebarRatio(value);
        const workspaceWidth = workspace.getBoundingClientRect().width;
        if (workspaceWidth &lt;= 0) return;
        const dividerWidth = 8;
        const usableWidth = Math.max(0, workspaceWidth - dividerWidth);
        const sidebarWidth = usableWidth * sidebarRatio;
        workspace.style.gridTemplateColumns = `minmax(0, 1fr) ${dividerWidth}px ${sidebarWidth}px`;
        floatingToday.style.right = `${sidebarWidth + dividerWidth + 16}px`;
        divider.setAttribute(&#x27;aria-valuenow&#x27;, String(Number((sidebarRatio * 100).toFixed(1))));
        divider.setAttribute(&#x27;aria-label&#x27;, `调整日历与 TODO 栏宽度，当前 TODO 栏占 ${Math.round(sidebarRatio * 100)}%`);
      }

      function ratioFromPointer(clientX) {
        const bounds = workspace.getBoundingClientRect();
        const usableWidth = Math.max(1, bounds.width - 8);
        const sidebarWidth = bounds.right - clientX - 4;
        return sidebarWidth / usableWidth;
      }

      function finishSplitDrag(event) {
        if (splitPointerId === null || (event &amp;&amp; event.pointerId !== splitPointerId)) return;
        if (divider.hasPointerCapture(splitPointerId)) divider.releasePointerCapture(splitPointerId);
        splitPointerId = null;
        shell.classList.remove(&#x27;is-resizing&#x27;);
        showToast(`TODO 栏宽度 ${Math.round(sidebarRatio * 100)}%`);
      }

      function addDays(date, amount) {
        const result = new Date(date);
        result.setDate(result.getDate() + amount);
        return result;
      }

      function keyOf(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, &#x27;0&#x27;);
        const day = String(date.getDate()).padStart(2, &#x27;0&#x27;);
        return `${year}-${month}-${day}`;
      }

      function sameDate(a, b) {
        return keyOf(a) === keyOf(b);
      }

      function clampStart(value) {
        return Math.max(0, Math.min(24 - visibleWeeks, value));
      }

      function getDetails(date) {
        const key = keyOf(date);
        if (!taskDetails[key]) {
          const names = taskNames[key] || [&#x27;暂无待办&#x27;];
          taskDetails[key] = names.map((name, index) =&gt; ({
            name,
            meta: index === 0 ? &#x27;高 · 09:30 · 工作&#x27; : index === 1 ? &#x27;中 · 计划 DDL 18:00&#x27; : &#x27;无优先级&#x27;,
            overdue: key === &#x27;2026-09-03&#x27; &amp;&amp; index === 1,
            done: key === &#x27;2026-09-03&#x27; &amp;&amp; index === names.length - 1
          }));
        }
        return taskDetails[key];
      }

      function formatShort(date) {
        return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
      }

      function selectedTitle() {
        return `${selected.getMonth() + 1} 月 ${selected.getDate()} 日，${weekdays[selected.getDay()]}`;
      }

      function createDay(date, physicalPreviewLimit) {
        const key = keyOf(date);
        const tasks = taskNames[key] || [];
        const button = document.createElement(&#x27;button&#x27;);
        button.type = &#x27;button&#x27;;
        button.className = &#x27;ew-day&#x27;;
        button.dataset.dateKey = key;
        if (sameDate(date, selected)) button.classList.add(&#x27;is-selected&#x27;);
        if (sameDate(date, today)) button.classList.add(&#x27;is-today&#x27;);
        if ([0, 6].includes(date.getDay())) button.classList.add(&#x27;is-weekend&#x27;);
        button.setAttribute(&#x27;aria-label&#x27;, `${formatShort(date)}，单击选择，双击全屏打开待办`);

        const top = document.createElement(&#x27;div&#x27;);
        top.className = &#x27;ew-day-top&#x27;;
        const dateNumber = document.createElement(&#x27;span&#x27;);
        dateNumber.className = &#x27;ew-date&#x27;;
        dateNumber.textContent = String(date.getDate());
        if (date.getDate() === 1) {
          button.classList.add(&#x27;is-month-start&#x27;);
          const month = document.createElement(&#x27;span&#x27;);
          month.className = `ew-month-watermark${date.getMonth() &gt;= 10 ? &#x27; is-long&#x27; : &#x27;&#x27;}`;
          month.textContent = chineseMonths[date.getMonth()];
          month.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
          button.appendChild(month);
        }
        top.appendChild(dateNumber);
        if (calendarLabels[key]) {
          const label = document.createElement(&#x27;span&#x27;);
          label.className = &#x27;ew-calendar-label&#x27;;
          label.textContent = calendarLabels[key];
          top.appendChild(label);
        }
        button.appendChild(top);

        const list = document.createElement(&#x27;div&#x27;);
        list.className = &#x27;ew-preview-list&#x27;;
        const shown = Math.min(6, physicalPreviewLimit, tasks.length);
        tasks.slice(0, shown).forEach((task, index) =&gt; {
          const row = document.createElement(&#x27;div&#x27;);
          row.className = `ew-preview-task${index === 0 ? &#x27; is-high&#x27; : &#x27;&#x27;}`;
          row.textContent = task;
          list.appendChild(row);
        });
        if (tasks.length &gt; shown) {
          const more = document.createElement(&#x27;div&#x27;);
          more.className = &#x27;ew-more&#x27;;
          more.textContent = `还有 ${tasks.length - shown} 项`;
          list.appendChild(more);
        }
        button.appendChild(list);
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          selected = new Date(date);
          updateSelection();
          renderTaskLists();
        });
        button.addEventListener(&#x27;dblclick&#x27;, () =&gt; {
          selected = new Date(date);
          updateSelection();
          renderTaskLists();
          openFocus();
        });
        return button;
      }

      function updateSelection() {
        const selectedKey = keyOf(selected);
        root.querySelectorAll(&#x27;.ew-day[data-date-key]&#x27;).forEach(day =&gt; {
          day.classList.toggle(&#x27;is-selected&#x27;, day.dataset.dateKey === selectedKey);
        });
      }

      function renderCalendar() {
        const viewportHeight = Math.max(1, grid.getBoundingClientRect().height);
        grid.style.gridTemplateRows = `repeat(${visibleWeeks}, minmax(0, 1fr))`;
        const rowHeight = viewportHeight / visibleWeeks;
        const physicalPreviewLimit = Math.max(1, Math.floor((rowHeight - 38) / 15));
        const firstDate = addDays(timelineStart, startWeek * 7);
        const lastDate = addDays(firstDate, visibleWeeks * 7 - 1);
        const days = [];
        for (let offset = 0; offset &lt; visibleWeeks * 7; offset += 1) {
          days.push(createDay(addDays(firstDate, offset), physicalPreviewLimit));
        }
        grid.replaceChildren(...days);
        weekCountLabel.textContent = `${visibleWeeks} 周`;
        visibleRange.textContent = `可用 ${Math.round(viewportHeight)}px ÷ ${visibleWeeks} 周 = ${rowHeight.toFixed(1)}px/日 · ${formatShort(firstDate)}—${formatShort(lastDate)} · 最多 ${Math.min(6, physicalPreviewLimit)} 条`;
        const center = addDays(firstDate, Math.floor(visibleWeeks * 7 / 2));
        rangeLabel.textContent = `${center.getFullYear()} 年 ${center.getMonth() + 1} 月`;
      }

      function createTaskRow(item, focusMode) {
        const button = document.createElement(&#x27;button&#x27;);
        button.type = &#x27;button&#x27;;
        button.className = `${focusMode ? &#x27;ew-focus-task&#x27; : &#x27;ew-side-task&#x27;}${item.done ? &#x27; is-done&#x27; : &#x27;&#x27;}`;
        const check = document.createElement(&#x27;span&#x27;);
        check.className = &#x27;ew-checkbox&#x27;;
        check.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        const copy = document.createElement(&#x27;span&#x27;);
        copy.className = &#x27;ew-task-copy&#x27;;
        const name = document.createElement(&#x27;span&#x27;);
        name.className = &#x27;ew-task-name&#x27;;
        name.textContent = item.name;
        const meta = document.createElement(&#x27;span&#x27;);
        meta.className = `ew-task-meta${item.overdue &amp;&amp; !item.done ? &#x27; is-overdue&#x27; : &#x27;&#x27;}`;
        meta.textContent = item.overdue &amp;&amp; !item.done ? `${item.meta} · 已逾期` : item.meta;
        copy.append(name, meta);
        button.append(check, copy);
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          item.done = !item.done;
          renderTaskLists();
          showToast(item.done ? &#x27;任务已完成并移至底部&#x27; : &#x27;任务已恢复&#x27;);
        });
        return button;
      }

      function renderTaskLists() {
        const items = getDetails(selected);
        const pending = items.filter(item =&gt; !item.done);
        const completed = items.filter(item =&gt; item.done);
        sideDate.textContent = selectedTitle();
        sideMeta.textContent = `${pending.length} 项未完成 · ${completed.length} 项已完成`;
        activeHost.replaceChildren(...pending.map(item =&gt; createTaskRow(item, false)));
        doneHost.replaceChildren(...completed.map(item =&gt; createTaskRow(item, false)));
        doneCount.textContent = String(completed.length);
        focusTitle.textContent = selectedTitle();
        focusCount.textContent = `${pending.length} 项未完成`;
        focusActive.replaceChildren(...pending.map(item =&gt; createTaskRow(item, true)));
        focusDone.replaceChildren(...completed.map(item =&gt; createTaskRow(item, true)));
        focusDoneCount.textContent = String(completed.length);
      }

      function changeVisibleWeeks(nextValue) {
        const next = Math.max(5, Math.min(10, nextValue));
        if (next === visibleWeeks) {
          showToast(next === 5 ? &#x27;最少显示 5 周&#x27; : &#x27;最多显示 10 周&#x27;);
          return;
        }
        const centerWeek = startWeek + Math.floor(visibleWeeks / 2);
        visibleWeeks = next;
        startWeek = clampStart(centerWeek - Math.floor(visibleWeeks / 2));
        renderCalendar();
        showToast(`当前显示 ${visibleWeeks} 周`);
      }

      function jumpMonth(direction) {
        const firstDate = addDays(timelineStart, startWeek * 7);
        const centerDate = addDays(firstDate, Math.floor(visibleWeeks * 7 / 2));
        const target = new Date(centerDate.getFullYear(), centerDate.getMonth() + direction, 15);
        const diffDays = Math.round((target - timelineStart) / 86400000);
        startWeek = clampStart(Math.floor(diffDays / 7) - Math.floor(visibleWeeks / 2));
        renderCalendar();
      }

      function openFocus() {
        focus.classList.add(&#x27;is-visible&#x27;);
        focus.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
        focus.querySelector(&#x27;[data-action=&quot;collapse&quot;]&#x27;).focus();
      }

      function closeFocus() {
        focus.classList.remove(&#x27;is-visible&#x27;);
        focus.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add(&#x27;is-visible&#x27;);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;is-visible&#x27;), 1600);
      }

      function submitQuickAdd(input) {
        const value = input.value.trim();
        if (!value) return;
        const items = getDetails(selected);
        if (items.length === 1 &amp;&amp; items[0].name === &#x27;暂无待办&#x27;) items.length = 0;
        items.push({name:value, meta:&#x27;无优先级&#x27;, overdue:false, done:false});
        input.value = &#x27;&#x27;;
        renderTaskLists();
        showToast(`已添加：${value}`);
      }

      root.querySelector(&#x27;[data-action=&quot;fewer-weeks&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; changeVisibleWeeks(visibleWeeks - 1));
      root.querySelector(&#x27;[data-action=&quot;more-weeks&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; changeVisibleWeeks(visibleWeeks + 1));
      root.querySelector(&#x27;[data-action=&quot;previous-month&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; jumpMonth(-1));
      root.querySelector(&#x27;[data-action=&quot;next-month&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; jumpMonth(1));
      root.querySelectorAll(&#x27;[data-action=&quot;today&quot;]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        startWeek = 5;
        selected = new Date(today);
        closeFocus();
        renderCalendar();
        renderTaskLists();
        showToast(`已回到今天 · 保持 ${visibleWeeks} 周`);
      }));
      root.querySelector(&#x27;[data-action=&quot;expand&quot;]&#x27;).addEventListener(&#x27;click&#x27;, openFocus);
      root.querySelector(&#x27;[data-action=&quot;collapse&quot;]&#x27;).addEventListener(&#x27;click&#x27;, closeFocus);
      root.querySelector(&#x27;#ew-quick-add&#x27;).addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (event.key === &#x27;Enter&#x27;) submitQuickAdd(event.currentTarget);
      });
      root.querySelector(&#x27;#ew-focus-add&#x27;).addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (event.key === &#x27;Enter&#x27;) submitQuickAdd(event.currentTarget);
      });
      divider.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
        event.preventDefault();
        splitPointerId = event.pointerId;
        divider.setPointerCapture(event.pointerId);
        shell.classList.add(&#x27;is-resizing&#x27;);
        applySidebarRatio(ratioFromPointer(event.clientX));
      });
      divider.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
        if (event.pointerId !== splitPointerId) return;
        applySidebarRatio(ratioFromPointer(event.clientX));
      });
      divider.addEventListener(&#x27;pointerup&#x27;, finishSplitDrag);
      divider.addEventListener(&#x27;pointercancel&#x27;, finishSplitDrag);
      divider.addEventListener(&#x27;dblclick&#x27;, () =&gt; {
        applySidebarRatio(0.125);
        showToast(&#x27;TODO 栏已恢复为 12.5%&#x27;);
      });
      divider.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        let nextRatio = sidebarRatio;
        if (event.key === &#x27;ArrowLeft&#x27;) nextRatio += 0.025;
        else if (event.key === &#x27;ArrowRight&#x27;) nextRatio -= 0.025;
        else if (event.key === &#x27;Home&#x27;) nextRatio = 0.125;
        else if (event.key === &#x27;End&#x27;) nextRatio = 0.5;
        else return;
        event.preventDefault();
        applySidebarRatio(nextRatio);

      root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (event.key === &#x27;Escape&#x27; &amp;&amp; focus.classList.contains(&#x27;is-visible&#x27;)) closeFocus();

      grid.addEventListener(&#x27;wheel&#x27;, event =&gt; {
        event.preventDefault();
        const now = Date.now();
        if (now - lastWheelAt &lt; 110) return;
        lastWheelAt = now;
        const direction = event.deltaY &gt; 0 ? 1 : -1;
        if (event.ctrlKey) {
          changeVisibleWeeks(visibleWeeks + direction);
        } else {
          startWeek = clampStart(startWeek + direction);
          renderCalendar();

      new ResizeObserver(entries =&gt; {
        const nextHeight = Math.round(entries[0].contentRect.height);
        if (nextHeight &gt; 0 &amp;&amp; nextHeight !== lastObservedGridHeight) {
          lastObservedGridHeight = nextHeight;
          renderCalendar();

      new ResizeObserver(entries =&gt; {
        const nextWidth = Math.round(entries[0].contentRect.width);
        if (nextWidth &gt; 0 &amp;&amp; nextWidth !== lastObservedWorkspaceWidth) {
          lastObservedWorkspaceWidth = nextWidth;
          applySidebarRatio(sidebarRatio);
        }
      }).observe(workspace);
      requestAnimationFrame(() =&gt; {
        applySidebarRatio(sidebarRatio);
        renderCalendar();
        renderTaskLists();
      });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
