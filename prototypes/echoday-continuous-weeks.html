        '2026-09-25': ['准备中秋礼物', '家庭聚餐'],
        '2026-10-01': ['国庆出行', '检查门窗'],
        '2026-10-12': ['十月阶段复盘', '整理照片'],
        '2026-10-20': ['项目备份', '预约体检'],
        '2026-11-06': ['冬季计划', '年度目标预览']
      };
      const calendarLabels = {
        '2026-09-07': '白露',
        '2026-09-23': '秋分',
        '2026-09-25': '中秋·休',
        '2026-10-01': '国庆·休',
        '2026-10-10': '班',
        '2026-11-07': '立冬'
      };
      const taskDetails = {};
      let visibleWeeks = 5;
      let startWeek = 5;
      let selected = new Date(today);
      let toastTimer;
      let lastWheelAt = 0;
      let lastObservedGridHeight = 0;
      let lastObservedWorkspaceWidth = 0;
      let sidebarRatio = 0.125;
      let splitPointerId = null;

      function clampSidebarRatio(value) {
        return Math.max(0.125, Math.min(0.5, value));
      }

      function applySidebarRatio(value) {
        sidebarRatio = clampSidebarRatio(value);
        const workspaceWidth = workspace.getBoundingClientRect().width;
        if (workspaceWidth <= 0) return;
        const dividerWidth = 8;
        const usableWidth = Math.max(0, workspaceWidth - dividerWidth);
        const sidebarWidth = usableWidth * sidebarRatio;
        workspace.style.gridTemplateColumns = `minmax(0, 1fr) ${dividerWidth}px ${sidebarWidth}px`;
        floatingToday.style.right = `${sidebarWidth + dividerWidth + 16}px`;
        divider.setAttribute('aria-valuenow', String(Number((sidebarRatio * 100).toFixed(1))));
        divider.setAttribute('aria-label', `调整日历与 TODO 栏宽度，当前 TODO 栏占 ${Math.round(sidebarRatio * 100)}%`);
      }

      function ratioFromPointer(clientX) {
        const bounds = workspace.getBoundingClientRect();
        const usableWidth = Math.max(1, bounds.width - 8);
        const sidebarWidth = bounds.right - clientX - 4;
        return sidebarWidth / usableWidth;
      }

      function finishSplitDrag(event) {
        if (splitPointerId === null || (event && event.pointerId !== splitPointerId)) return;
        if (divider.hasPointerCapture(splitPointerId)) divider.releasePointerCapture(splitPointerId);
        splitPointerId = null;
        shell.classList.remove('is-resizing');
        showToast(`TODO 栏宽度 ${Math.round(sidebarRatio * 100)}%`);
      }

      function addDays(date, amount) {
        const result = new Date(date);
        result.setDate(result.getDate() + amount);
        return result;
      }

      function keyOf(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function sameDate(a, b) {
        return keyOf(a) === keyOf(b);
      }

      function clampStart(value) {
        return Math.max(0, Math.min(24 - visibleWeeks, value));
      }

      function getDetails(date) {
        const key = keyOf(date);
        if (!taskDetails[key]) {
          const names = taskNames[key] || ['暂无待办'];
          taskDetails[key] = names.map((name, index) => ({
            name,
            meta: index === 0 ? '高 · 09:30 · 工作' : index === 1 ? '中 · 计划 DDL 18:00' : '无优先级',
            overdue: key === '2026-09-03' && index === 1,
            done: key === '2026-09-03' && index === names.length - 1
          }));
        }
        return taskDetails[key];
      }

      function formatShort(date) {
        return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
      }

      function selectedTitle() {
        return `${selected.getMonth() + 1} 月 ${selected.getDate()} 日，${weekdays[selected.getDay()]}`;
      }

      function createDay(date, physicalPreviewLimit) {
        const key = keyOf(date);
        const tasks = taskNames[key] || [];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'ew-day';
        button.dataset.dateKey = key;
        if (sameDate(date, selected)) button.classList.add('is-selected');
        if (sameDate(date, today)) button.classList.add('is-today');
        if ([0, 6].includes(date.getDay())) button.classList.add('is-weekend');
        button.setAttribute('aria-label', `${formatShort(date)}，单击选择，双击全屏打开待办`);

        const top = document.createElement('div');
        top.className = 'ew-day-top';
        const dateNumber = document.createElement('span');
        dateNumber.className = 'ew-date';
        dateNumber.textContent = String(date.getDate());
        if (date.getDate() === 1) {
          button.classList.add('is-month-start');
          const month = document.createElement('span');
          month.className = `ew-month-watermark${date.getMonth() >= 10 ? ' is-long' : ''}`;
          month.textContent = chineseMonths[date.getMonth()];
          month.setAttribute('aria-hidden', 'true');
          button.appendChild(month);
        }
        top.appendChild(dateNumber);
        if (calendarLabels[key]) {
          const label = document.createElement('span');
          label.className = 'ew-calendar-label';
          label.textContent = calendarLabels[key];
          top.appendChild(label);
        }
        button.appendChild(top);

        const list = document.createElement('div');
        list.className = 'ew-preview-list';
        const shown = Math.min(6, physicalPreviewLimit, tasks.length);
        tasks.slice(0, shown).forEach((task, index) => {
          const row = document.createElement('div');
          row.className = `ew-preview-task${index === 0 ? ' is-high' : ''}`;
          row.textContent = task;
          list.appendChild(row);
        });
        if (tasks.length > shown) {
          const more = document.createElement('div');
          more.className = 'ew-more';
          more.textContent = `还有 ${tasks.length - shown} 项`;
          list.appendChild(more);
        }
        button.appendChild(list);
        button.addEventListener('click', () => {
          selected = new Date(date);
          updateSelection();
          renderTaskLists();
        });
        button.addEventListener('dblclick', () => {
          selected = new Date(date);
          updateSelection();
          renderTaskLists();
          openFocus();
        });
        return button;
      }

      function updateSelection() {
        const selectedKey = keyOf(selected);
        root.querySelectorAll('.ew-day[data-date-key]').forEach(day => {
          day.classList.toggle('is-selected', day.dataset.dateKey === selectedKey);
        });
      }

      function renderCalendar() {
        const viewportHeight = Math.max(1, grid.getBoundingClientRect().height);
        grid.style.gridTemplateRows = `repeat(${visibleWeeks}, minmax(0, 1fr))`;
        const rowHeight = viewportHeight / visibleWeeks;
        const physicalPreviewLimit = Math.max(1, Math.floor((rowHeight - 38) / 15));
        const firstDate = addDays(timelineStart, startWeek * 7);
        const lastDate = addDays(firstDate, visibleWeeks * 7 - 1);
        const days = [];
        for (let offset = 0; offset < visibleWeeks * 7; offset += 1) {
          days.push(createDay(addDays(firstDate, offset), physicalPreviewLimit));
        }
        grid.replaceChildren(...days);
        weekCountLabel.textContent = `${visibleWeeks} 周`;
        visibleRange.textContent = `可用 ${Math.round(viewportHeight)}px ÷ ${visibleWeeks} 周 = ${rowHeight.toFixed(1)}px/日 · ${formatShort(firstDate)}—${formatShort(lastDate)} · 最多 ${Math.min(6, physicalPreviewLimit)} 条`;
        const center = addDays(firstDate, Math.floor(visibleWeeks * 7 / 2));
        rangeLabel.textContent = `${center.getFullYear()} 年 ${center.getMonth() + 1} 月`;
      }

      function createTaskRow(item, focusMode) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `${focusMode ? 'ew-focus-task' : 'ew-side-task'}${item.done ? ' is-done' : ''}`;
        const check = document.createElement('span');
        check.className = 'ew-checkbox';
        check.setAttribute('aria-hidden', 'true');
        const copy = document.createElement('span');
        copy.className = 'ew-task-copy';
        const name = document.createElement('span');
        name.className = 'ew-task-name';
        name.textContent = item.name;
        const meta = document.createElement('span');
        meta.className = `ew-task-meta${item.overdue && !item.done ? ' is-overdue' : ''}`;
        meta.textContent = item.overdue && !item.done ? `${item.meta} · 已逾期` : item.meta;
        copy.append(name, meta);
        button.append(check, copy);
        button.addEventListener('click', () => {
          item.done = !item.done;
          renderTaskLists();
          showToast(item.done ? '任务已完成并移至底部' : '任务已恢复');
        });
        return button;
      }

      function renderTaskLists() {
        const items = getDetails(selected);
        const pending = items.filter(item => !item.done);
        const completed = items.filter(item => item.done);
        sideDate.textContent = selectedTitle();
        sideMeta.textContent = `${pending.length} 项未完成 · ${completed.length} 项已完成`;
        activeHost.replaceChildren(...pending.map(item => createTaskRow(item, false)));
        doneHost.replaceChildren(...completed.map(item => createTaskRow(item, false)));
        doneCount.textContent = String(completed.length);
        focusTitle.textContent = selectedTitle();
        focusCount.textContent = `${pending.length} 项未完成`;
        focusActive.replaceChildren(...pending.map(item => createTaskRow(item, true)));
        focusDone.replaceChildren(...completed.map(item => createTaskRow(item, true)));
        focusDoneCount.textContent = String(completed.length);
      }

      function changeVisibleWeeks(nextValue) {
        const next = Math.max(5, Math.min(10, nextValue));
        if (next === visibleWeeks) {
          showToast(next === 5 ? '最少显示 5 周' : '最多显示 10 周');
          return;
        }
        const centerWeek = startWeek + Math.floor(visibleWeeks / 2);
        visibleWeeks = next;
        startWeek = clampStart(centerWeek - Math.floor(visibleWeeks / 2));
        renderCalendar();
        showToast(`当前显示 ${visibleWeeks} 周`);
      }

      function jumpMonth(direction) {
        const firstDate = addDays(timelineStart, startWeek * 7);
        const centerDate = addDays(firstDate, Math.floor(visibleWeeks * 7 / 2));
        const target = new Date(centerDate.getFullYear(), centerDate.getMonth() + direction, 15);
        const diffDays = Math.round((target - timelineStart) / 86400000);
        startWeek = clampStart(Math.floor(diffDays / 7) - Math.floor(visibleWeeks / 2));
        renderCalendar();
      }

      function openFocus() {
        focus.classList.add('is-visible');
        focus.setAttribute('aria-hidden', 'false');
        focus.querySelector('[data-action="collapse"]').focus();
      }

      function closeFocus() {
        focus.classList.remove('is-visible');
        focus.setAttribute('aria-hidden', 'true');
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 1600);
      }

      function submitQuickAdd(input) {
        const value = input.value.trim();
        if (!value) return;
        const items = getDetails(selected);
        if (items.length === 1 && items[0].name === '暂无待办') items.length = 0;
        items.push({name:value, meta:'无优先级', overdue:false, done:false});
        input.value = '';
        renderTaskLists();
        showToast(`已添加：${value}`);
      }

      root.querySelector('[data-action="fewer-weeks"]').addEventListener('click', () => changeVisibleWeeks(visibleWeeks - 1));
      root.querySelector('[data-action="more-weeks"]').addEventListener('click', () => changeVisibleWeeks(visibleWeeks + 1));
      root.querySelector('[data-action="previous-month"]').addEventListener('click', () => jumpMonth(-1));
      root.querySelector('[data-action="next-month"]').addEventListener('click', () => jumpMonth(1));
      root.querySelectorAll('[data-action="today"]').forEach(button => button.addEventListener('click', () => {
        startWeek = 5;
        selected = new Date(today);
        closeFocus();
        renderCalendar();
        renderTaskLists();
        showToast(`已回到今天 · 保持 ${visibleWeeks} 周`);
      }));
      root.querySelector('[data-action="expand"]').addEventListener('click', openFocus);
      root.querySelector('[data-action="collapse"]').addEventListener('click', closeFocus);
      root.querySelector('#ew-quick-add').addEventListener('keydown', event => {
        if (event.key === 'Enter') submitQuickAdd(event.currentTarget);
      });
      root.querySelector('#ew-focus-add').addEventListener('keydown', event => {
        if (event.key === 'Enter') submitQuickAdd(event.currentTarget);
      });
      divider.addEventListener('pointerdown', event => {
        event.preventDefault();
        splitPointerId = event.pointerId;
        divider.setPointerCapture(event.pointerId);
        shell.classList.add('is-resizing');
        applySidebarRatio(ratioFromPointer(event.clientX));
      });
      divider.addEventListener('pointermove', event => {
        if (event.pointerId !== splitPointerId) return;
        applySidebarRatio(ratioFromPointer(event.clientX));
      });
      divider.addEventListener('pointerup', finishSplitDrag);
      divider.addEventListener('pointercancel', finishSplitDrag);
      divider.addEventListener('dblclick', () => {
        applySidebarRatio(0.125);
        showToast('TODO 栏已恢复为 12.5%');
      });
      divider.addEventListener('keydown', event => {
        let nextRatio = sidebarRatio;
        if (event.key === 'ArrowLeft') nextRatio += 0.025;
        else if (event.key === 'ArrowRight') nextRatio -= 0.025;
        else if (event.key === 'Home') nextRatio = 0.125;
        else if (event.key === 'End') nextRatio = 0.5;
        else return;
        event.preventDefault();
        applySidebarRatio(nextRatio);
      });
      root.addEventListener('keydown', event => {
        if (event.key === 'Escape' && focus.classList.contains('is-visible')) closeFocus();
      });
      grid.addEventListener('wheel', event => {
        event.preventDefault();
        const now = Date.now();
        if (now - lastWheelAt < 110) return;
        lastWheelAt = now;
        const direction = event.deltaY > 0 ? 1 : -1;
        if (event.ctrlKey) {
          changeVisibleWeeks(visibleWeeks + direction);
        } else {
          startWeek = clampStart(startWeek + direction);
          renderCalendar();
        }
      }, {passive:false});

      new ResizeObserver(entries => {
        const nextHeight = Math.round(entries[0].contentRect.height);
        if (nextHeight > 0 && nextHeight !== lastObservedGridHeight) {
          lastObservedGridHeight = nextHeight;
          renderCalendar();
        }
      }).observe(grid);
      new ResizeObserver(entries => {
        const nextWidth = Math.round(entries[0].contentRect.width);
        if (nextWidth > 0 && nextWidth !== lastObservedWorkspaceWidth) {
          lastObservedWorkspaceWidth = nextWidth;
          applySidebarRatio(sidebarRatio);
        }
      }).observe(workspace);
      requestAnimationFrame(() => {
        applySidebarRatio(sidebarRatio);
        renderCalendar();
        renderTaskLists();
      });
    })();
  </script>
</div>
