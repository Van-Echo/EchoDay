name: echoday
description: "丸成 EchoDay — an offline-first calendar and TODO planner."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1
  html: ^0.15.6
  http: ^1.5.0
  intl: ^0.20.3
  logging: ^1.3.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.34.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/holidays/
