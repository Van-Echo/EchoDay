name: echoday
description: "丸成 EchoDay — an offline-first calendar and TODO planner."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  font_awesome_flutter: ^11.0.0
  go_router: ^18.0.1
  html: ^0.15.6
  hotkey_manager: ^0.2.3
  http: ^1.5.0
  intl: ^0.20.3
  logging: ^1.3.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.34.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - assets/branding/echoday_maru.png
    - assets/branding/echoday_cheng.png
    - assets/holidays/
  fonts:
    - family: EchoDaySans
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
    - family: EchoDayMonthKai
      fonts:
        - asset: assets/fonts/EchoDayMonthKai.ttf
